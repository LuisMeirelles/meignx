name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        working-directory: ./meignx
        run: cmake --preset release

      - name: Build
        working-directory: ./meignx
        run: cmake --build --preset release

      - name: Package
        working-directory: ./meignx
        run: |
          set -euo pipefail

          mkdir -p dist/package

          cp build/release/meignx dist/package/meignx

          tar \
            -C dist/package \
            -czf dist/meignx-linux-x86_64.tar.gz \
            meignx

          cd dist

          sha256sum meignx-linux-x86_64.tar.gz \
            > meignx-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: meignx-${{ github.sha }}
          path: |
            meignx/dist/meignx-linux-x86_64.tar.gz
            meignx/dist/meignx-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30


  release:
    name: GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: meignx-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "${{ github.ref_name }}" \
            release/meignx-linux-x86_64.tar.gz \
            release/meignx-linux-x86_64.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "meignx ${{ github.ref_name }}"


  docker:
    name: Docker Hub
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/meignx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./meignx
          file: ./meignx/.docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}